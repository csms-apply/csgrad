<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Lộ trình nộp hồ sơ cao học kỳ Thu 2027</title>
  <desc id="desc">Bốn giai đoạn chuẩn bị từ tháng 1/2026 đến tháng 1/2027: thi chứng chỉ, tích lũy kinh nghiệm, thư giới thiệu và hồ sơ, nộp đơn.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:20px;font-weight:700;letter-spacing:2px;fill:#2f6fed}.title{font-size:40px;font-weight:750;fill:#10233f}.phase{font-size:23px;font-weight:700;fill:#10233f}.date{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:16px;fill:#52627a}.num{font-size:18px;font-weight:800;fill:white}
  </style>
  <rect width="1400" height="580" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1398" height="578" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="54" y="58">BẢN ĐỒ KẾ HOẠCH</text>
  <text class="sans title" x="54" y="106">Lộ trình nộp hồ sơ kỳ Thu 2027</text>
  <text class="sans body" x="54" y="144">Bắt đầu sớm, đi từ xây dựng hồ sơ đến chuẩn bị giấy tờ và nộp đơn.</text>
  <g class="sans">
    <g transform="translate(40 190)">
      <rect width="305" height="315" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <circle cx="38" cy="42" r="23" fill="#2f6fed"/><text class="num" x="38" y="49" text-anchor="middle">1</text>
      <text class="date" x="76" y="48">THÁNG 1–5/2026</text>
      <text class="phase" x="28" y="105">Chuẩn bị chứng chỉ</text>
      <text class="body" x="28" y="148">Ôn TOEFL / IELTS và GRE</text><text class="body" x="28" y="176">nếu chương trình bạn nhắm</text><text class="body" x="28" y="204">đến có yêu cầu.</text>
    </g>
    <g transform="translate(378 190)">
      <rect width="305" height="315" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <circle cx="38" cy="42" r="23" fill="#258a79"/><text class="num" x="38" y="49" text-anchor="middle">2</text>
      <text class="date" x="76" y="48">THÁNG 5–9/2026</text>
      <text class="phase" x="28" y="105">Tích lũy kinh nghiệm</text>
      <text class="body" x="28" y="148">Củng cố thực tập, nghiên cứu</text><text class="body" x="28" y="176">và dự án để làm nổi bật</text><text class="body" x="28" y="204">câu chuyện hồ sơ của bạn.</text>
    </g>
    <g transform="translate(716 190)">
      <rect width="305" height="315" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <circle cx="38" cy="42" r="23" fill="#8b5cf6"/><text class="num" x="38" y="49" text-anchor="middle">3</text>
      <text class="date" x="76" y="48">THÁNG 9–10/2026</text>
      <text class="phase" x="28" y="105">Chuẩn bị hồ sơ</text>
      <text class="body" x="28" y="148">Chốt người viết thư giới thiệu,</text><text class="body" x="28" y="176">soạn CV, bài luận và hồ sơ</text><text class="body" x="28" y="204">riêng cho từng trường.</text>
    </g>
    <g transform="translate(1054 190)">
      <rect width="305" height="315" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <circle cx="38" cy="42" r="23" fill="#d97706"/><text class="num" x="38" y="49" text-anchor="middle">4</text>
      <text class="date" x="76" y="48" style="font-size:15px">THÁNG 10/2026–1/2027</text>
      <text class="phase" x="28" y="105">Nộp đơn</text>
      <text class="body" x="28" y="148">Hoàn thiện hồ sơ từng trường,</text><text class="body" x="28" y="176">nộp trước hạn chót và theo dõi</text><text class="body" x="28" y="204">mọi yêu cầu.</text>
    </g>
  </g>
</svg>
