<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">Lộ trình nộp hồ sơ cao học kỳ Thu 2027</title>
  <desc id="desc">Bốn giai đoạn chuẩn bị từ tháng 1/2026 đến tháng 1/2027: thi chứng chỉ, tích lũy kinh nghiệm, thư giới thiệu và hồ sơ, nộp đơn.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#2f6fed}.title{font-size:34px;font-weight:750;fill:#10233f}.phase{font-size:24px;font-weight:700;fill:#10233f}.date{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:18px;fill:#52627a}.num{font-size:18px;font-weight:800;fill:white}
  </style>
  <rect width="720" height="1160" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="718" height="1158" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="40" y="52">BẢN ĐỒ KẾ HOẠCH</text>
  <text class="sans title" x="40" y="96">Lộ trình nộp hồ sơ kỳ Thu 2027</text>
  <text class="sans body" x="40" y="132">Từ xây dựng hồ sơ đến chuẩn bị giấy tờ và nộp đơn.</text>
  <g class="sans">
    <g transform="translate(40 174)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#2f6fed"/><text class="num" x="42" y="49" text-anchor="middle">1</text><text class="date" x="82" y="48">THÁNG 1–5/2026</text><text class="phase" x="28" y="104">Chuẩn bị chứng chỉ</text><text class="body" x="28" y="148">Ôn TOEFL / IELTS và GRE nếu chương trình yêu cầu.</text></g>
    <g transform="translate(40 410)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#258a79"/><text class="num" x="42" y="49" text-anchor="middle">2</text><text class="date" x="82" y="48">THÁNG 5–9/2026</text><text class="phase" x="28" y="104">Tích lũy kinh nghiệm</text><text class="body" x="28" y="148">Củng cố thực tập, nghiên cứu và dự án.</text></g>
    <g transform="translate(40 646)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#8b5cf6"/><text class="num" x="42" y="49" text-anchor="middle">3</text><text class="date" x="82" y="48">THÁNG 9–10/2026</text><text class="phase" x="28" y="104">Chuẩn bị hồ sơ</text><text class="body" x="28" y="148">Chốt người viết thư giới thiệu; soạn CV và bài luận.</text></g>
    <g transform="translate(40 882)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#d97706"/><text class="num" x="42" y="49" text-anchor="middle">4</text><text class="date" x="82" y="48">THÁNG 10/2026–1/2027</text><text class="phase" x="28" y="104">Nộp đơn</text><text class="body" x="28" y="148">Hoàn thiện từng bộ hồ sơ và theo dõi mọi hạn nộp.</text></g>
  </g>
</svg>
