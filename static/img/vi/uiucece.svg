<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Các lộ trình hoàn thành UIUC ECE MEng</title>
  <desc id="desc">Ba kế hoạch học phổ biến: lộ trình rút gọn 1.5 năm, lộ trình 2 năm bắt đầu kỳ xuân và lộ trình 2 năm bắt đầu kỳ thu có thực tập tùy chọn.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#2f6fed}.title{font-size:38px;font-weight:760;fill:#10233f}.sub{font-size:19px;fill:#5b687c}.cardTitle{font-size:24px;font-weight:750;fill:#10233f}.term{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:16px;fill:#52627a}.badge{font-size:15px;font-weight:750;fill:#187565}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1400" height="820" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1398" height="818" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="54" y="58">KẾ HOẠCH HỌC</text>
  <text class="sans title" x="54" y="105">Lộ trình hoàn thành UIUC ECE MEng</text>
  <text class="sans sub" x="54" y="143">Kỳ thực tập thay đổi theo học kỳ bắt đầu và tốc độ học bạn chọn.</text>

  <g class="sans">
    <g transform="translate(40 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">A · 1.5 năm</text>
      <line x1="48" y1="120" x2="48" y2="438" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="135" r="11" fill="#2f6fed"/><text class="term" x="80" y="131">Thu năm 1</text><text class="body" x="80" y="157">Học kỳ 1 · học toàn thời gian</text>
      <circle cx="48" cy="225" r="11" fill="#2f6fed"/><text class="term" x="80" y="221">Xuân năm 1</text><text class="body" x="80" y="247">Học kỳ 2 · học toàn thời gian</text>
      <circle cx="48" cy="315" r="11" fill="#258a79"/><text class="term" x="80" y="311">Hè năm 1</text><text class="body" x="80" y="337">Thực tập tùy chọn · CPT + ENG 510</text><text class="body" x="80" y="361">ENG 572 tùy chọn (4 tín chỉ)</text>
      <circle cx="48" cy="430" r="11" fill="#d97706"/><text class="term" x="80" y="426">Thu năm 2</text><text class="body" x="80" y="452">Đủ 32 tín chỉ · tốt nghiệp tháng 12</text>
      <rect x="26" y="475" width="150" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="101" y="496" text-anchor="middle">NHANH NHẤT</text>
    </g>

    <g transform="translate(490 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">B · 2 năm · bắt đầu kỳ xuân</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">Xuân năm 1</text><text class="body" x="80" y="146">Học kỳ 1 · học toàn thời gian</text>
      <circle cx="48" cy="205" r="10" fill="#8fa0b7"/><text class="term" x="80" y="201">Hè năm 1</text><text class="body" x="80" y="226">Không thực tập tại Mỹ</text>
      <circle cx="48" cy="285" r="10" fill="#2f6fed"/><text class="term" x="80" y="281">Thu năm 1</text><text class="body" x="80" y="306">Học kỳ 2 · học toàn thời gian</text>
      <circle cx="48" cy="365" r="10" fill="#258a79"/><text class="term" x="80" y="361">Xuân / Hè năm 2</text><text class="body" x="80" y="386">Thực tập tùy chọn tối đa 6 tháng</text><text class="body" x="80" y="410">CPT + ENG 510; ENG 572 tùy chọn</text>
      <circle cx="48" cy="455" r="10" fill="#d97706"/><text class="term" x="80" y="451">Thu năm 2</text><text class="body" x="80" y="476">Đủ 32 tín chỉ · tốt nghiệp tháng 12</text>
    </g>

    <g transform="translate(940 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">C · 2 năm · bắt đầu kỳ thu</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">Thu năm 1</text><text class="body" x="80" y="146">Học kỳ 1 · học toàn thời gian</text>
      <circle cx="48" cy="215" r="10" fill="#2f6fed"/><text class="term" x="80" y="211">Xuân năm 1</text><text class="body" x="80" y="236">Học kỳ 2 · học toàn thời gian</text>
      <circle cx="48" cy="320" r="10" fill="#258a79"/><text class="term" x="80" y="316">Hè năm 1 / Thu năm 2</text><text class="body" x="80" y="341">Thực tập tùy chọn tối đa 6 tháng</text><text class="body" x="80" y="365">CPT + ENG 510; ENG 572 tùy chọn</text>
      <circle cx="48" cy="435" r="10" fill="#d97706"/><text class="term" x="80" y="431">Xuân năm 2</text><text class="body" x="80" y="456">Đủ 32 tín chỉ · tốt nghiệp tháng 5</text>
      <rect x="26" y="475" width="180" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="116" y="496" text-anchor="middle">THỰC TẬP DÀI</text>
    </g>
  </g>
  <text class="sans note" x="54" y="770">Lộ trình minh họa dựa trên sơ đồ kế hoạch của chương trình. Hãy xác nhận yêu cầu đăng ký học và CPT hiện hành với UIUC trước khi chọn.</text>
</svg>
