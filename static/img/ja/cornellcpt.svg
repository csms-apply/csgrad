<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Cornell 春学期入学とF-1移籍に関する案内</title>
  <desc id="desc">OPTでF-1ステータスを維持し、SEVISをCornellへ移籍し、夏のCPT資格を保つ方法に関するアドバイザー回答の要約。</desc>
  <style>
    .sans{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#b31b1b}.title{font-size:36px;font-weight:760;fill:#10233f}.sub{font-size:19px;fill:#5b687c}.step{font-size:20px;font-weight:700;fill:#23354d}.body{font-size:16px;fill:#52627a}.num{font-size:17px;font-weight:800;fill:white}.note{font-size:14px;fill:#6b7789}
  </style>
  <rect width="1200" height="820" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1198" height="818" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="56" y="58">アドバイザーの案内 · 要約</text>
  <text class="sans title" x="56" y="106">学部OPT後の春学期入学</text>
  <text class="sans sub" x="56" y="144">1月入学の前に、Cornell CS MEngの学生がステータスをつなぐ方法</text>
  <g class="sans" transform="translate(56 188)">
    <line x1="27" y1="28" x2="27" y2="372" stroke="#d8e0ec" stroke-width="4"/>
    <g transform="translate(0 0)"><circle cx="27" cy="28" r="22" fill="#b31b1b"/><text class="num" x="27" y="34" text-anchor="middle">1</text><text class="step" x="74" y="24">卒業後もF-1ステータスを維持</text><text class="body" x="74" y="52">承認済みの学部OPTを利用し、1月の入学までステータスを有効に保ちます。</text></g>
    <g transform="translate(0 104)"><circle cx="27" cy="28" r="22" fill="#2f6fed"/><text class="num" x="27" y="34" text-anchor="middle">2</text><text class="step" x="74" y="24">移籍の空白期間を5か月以内に抑える</text><text class="body" x="74" y="52">SEVISのリリース日を、Cornellのプログラム開始日から5か月以内に設定します。</text></g>
    <g transform="translate(0 208)"><circle cx="27" cy="28" r="22" fill="#258a79"/><text class="num" x="27" y="34" text-anchor="middle">3</text><text class="step" x="74" y="24">SEVIS記録をCornellへ移籍</text><text class="body" x="74" y="52">記録が新しい学校へリリースされると、OPTの就労許可は終了します。</text></g>
    <g transform="translate(0 312)"><circle cx="27" cy="28" r="22" fill="#8b5cf6"/><text class="num" x="27" y="34" text-anchor="middle">4</text><text class="step" x="74" y="24">新しいI-20でプログラムを開始</text><text class="body" x="74" y="52">海外渡航や米国への再入国の前に、CornellのI-20を取得してください。</text></g>
  </g>
  <rect x="56" y="604" width="1088" height="112" rx="18" fill="#fff4f2" stroke="#efc3bd"/>
  <text class="sans step" x="84" y="645" fill="#8d2521">この方法で得られること</text>
  <text class="sans body" x="84" y="678">有効なF-1ステータスが途切れなければ、春入学の学生も夏のCPTに必要な在学期間の要件を満たせる場合があります。</text>
  <text class="sans body" x="84" y="704">最終的な資格はCornellの留学生オフィスで確認してください。</text>
  <text class="sans note" x="56" y="770">この図は原文の書簡にあるアドバイザー回答を要約したものです。移民規則や学校の方針は変わる可能性があります。</text>
</svg>
