<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">2027年秋入学 大学院出願タイムライン</title>
  <desc id="desc">2026年1月から2027年1月までの4つの準備段階：試験、経験づくり、推薦状と書類の準備、出願書類の提出。</desc>
  <style>
    .sans{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic','Meiryo',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#2f6fed}.title{font-size:34px;font-weight:750;fill:#10233f}.phase{font-size:24px;font-weight:700;fill:#10233f}.date{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:18px;fill:#52627a}.num{font-size:18px;font-weight:800;fill:white}
  </style>
  <rect width="720" height="1160" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="718" height="1158" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="40" y="52">出願スケジュール</text>
  <text class="sans title" x="40" y="96">2027年秋入学 出願タイムライン</text>
  <text class="sans body" x="40" y="132">実績づくりから書類準備、提出まで。</text>
  <g class="sans">
    <g transform="translate(40 174)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#2f6fed"/><text class="num" x="42" y="49" text-anchor="middle">1</text><text class="date" x="82" y="48">2026年1–5月</text><text class="phase" x="28" y="104">試験対策</text><text class="body" x="28" y="148">必要に応じてTOEFL / IELTSとGREを準備します。</text></g>
    <g transform="translate(40 410)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#258a79"/><text class="num" x="42" y="49" text-anchor="middle">2</text><text class="date" x="82" y="48">2026年5–9月</text><text class="phase" x="28" y="104">経験を積む</text><text class="body" x="28" y="148">インターン、研究、プロジェクトを強化します。</text></g>
    <g transform="translate(40 646)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#8b5cf6"/><text class="num" x="42" y="49" text-anchor="middle">3</text><text class="date" x="82" y="48">2026年9–10月</text><text class="phase" x="28" y="104">書類準備</text><text class="body" x="28" y="148">推薦者を確定し、履歴書とエッセイを下書きします。</text></g>
    <g transform="translate(40 882)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#d97706"/><text class="num" x="42" y="49" text-anchor="middle">4</text><text class="date" x="82" y="48">2026年10月–2027年1月</text><text class="phase" x="28" y="104">出願書類の提出</text><text class="body" x="28" y="148">学校ごとの書類を仕上げ、すべての締切を管理します。</text></g>
  </g>
</svg>
