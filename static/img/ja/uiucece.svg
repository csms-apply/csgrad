<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">UIUC ECE MEng 学位取得までのルート</title>
  <desc id="desc">代表的な3つの履修計画：1.5年の短縮ルート、春学期入学の2年ルート、任意のインターンを含む秋学期入学の2年ルート。</desc>
  <style>
    .sans{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#2f6fed}.title{font-size:38px;font-weight:760;fill:#10233f}.sub{font-size:19px;fill:#5b687c}.cardTitle{font-size:24px;font-weight:750;fill:#10233f}.term{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:16px;fill:#52627a}.badge{font-size:15px;font-weight:750;fill:#187565}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1400" height="820" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1398" height="818" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="54" y="58">学位計画</text>
  <text class="sans title" x="54" y="105">UIUC ECE MEng 修了ルート</text>
  <text class="sans sub" x="54" y="143">インターンの時期は、入学学期と希望する履修ペースによって変わります。</text>

  <g class="sans">
    <g transform="translate(40 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">A · 1.5年</text>
      <line x1="48" y1="120" x2="48" y2="438" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="135" r="11" fill="#2f6fed"/><text class="term" x="80" y="131">1年目 秋</text><text class="body" x="80" y="157">第1学期 · フルタイム履修</text>
      <circle cx="48" cy="225" r="11" fill="#2f6fed"/><text class="term" x="80" y="221">1年目 春</text><text class="body" x="80" y="247">第2学期 · フルタイム履修</text>
      <circle cx="48" cy="315" r="11" fill="#258a79"/><text class="term" x="80" y="311">1年目 夏</text><text class="body" x="80" y="337">任意のインターン · CPT + ENG 510</text><text class="body" x="80" y="361">ENG 572は任意（4単位）</text>
      <circle cx="48" cy="430" r="11" fill="#d97706"/><text class="term" x="80" y="426">2年目 秋</text><text class="body" x="80" y="452">32単位を修了 · 12月に卒業</text>
      <rect x="26" y="475" width="150" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="101" y="496" text-anchor="middle">最短ルート</text>
    </g>

    <g transform="translate(490 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">B · 2年 · 春学期入学</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">1年目 春</text><text class="body" x="80" y="146">第1学期 · フルタイム履修</text>
      <circle cx="48" cy="205" r="10" fill="#8fa0b7"/><text class="term" x="80" y="201">1年目 夏</text><text class="body" x="80" y="226">米国内インターンなし</text>
      <circle cx="48" cy="285" r="10" fill="#2f6fed"/><text class="term" x="80" y="281">1年目 秋</text><text class="body" x="80" y="306">第2学期 · フルタイム履修</text>
      <circle cx="48" cy="365" r="10" fill="#258a79"/><text class="term" x="80" y="361">2年目 春 / 夏</text><text class="body" x="80" y="386">任意のインターン（最長6か月）</text><text class="body" x="80" y="410">CPT + ENG 510、ENG 572は任意</text>
      <circle cx="48" cy="455" r="10" fill="#d97706"/><text class="term" x="80" y="451">2年目 秋</text><text class="body" x="80" y="476">32単位を修了 · 12月に卒業</text>
    </g>

    <g transform="translate(940 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">C · 2年 · 秋学期入学</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">1年目 秋</text><text class="body" x="80" y="146">第1学期 · フルタイム履修</text>
      <circle cx="48" cy="215" r="10" fill="#2f6fed"/><text class="term" x="80" y="211">1年目 春</text><text class="body" x="80" y="236">第2学期 · フルタイム履修</text>
      <circle cx="48" cy="320" r="10" fill="#258a79"/><text class="term" x="80" y="316">1年目 夏 / 2年目 秋</text><text class="body" x="80" y="341">任意のインターン（最長6か月）</text><text class="body" x="80" y="365">CPT + ENG 510、ENG 572は任意</text>
      <circle cx="48" cy="435" r="10" fill="#d97706"/><text class="term" x="80" y="431">2年目 春</text><text class="body" x="80" y="456">32単位を修了 · 5月に卒業</text>
      <rect x="26" y="475" width="180" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="116" y="496" text-anchor="middle">長期インターン</text>
    </g>
  </g>
  <text class="sans note" x="54" y="770">プログラム計画の図をもとにした例示ルートです。計画を決める前に、最新の履修要件とCPT要件をUIUCに確認してください。</text>
</svg>
