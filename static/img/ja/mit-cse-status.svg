<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">MIT CSE SM 外部出願者の募集状況</title>
  <desc id="desc">MIT計算科学・工学（CSE）修士課程の外部出願者の募集は現在停止しています。</desc>
  <style>
    .sans{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#a31f34}.title{font-size:38px;font-weight:760;fill:#10233f}.body{font-size:22px;fill:#52627a}.status{font-size:17px;font-weight:800;letter-spacing:1px;fill:#8d2521}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1200" height="410" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1198" height="408" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <rect x="56" y="56" width="92" height="92" rx="22" fill="#fff0f1"/>
  <path d="M102 79v35M102 130h.1" stroke="#a31f34" stroke-width="10" stroke-linecap="round"/>
  <text class="sans eyebrow" x="184" y="72">プログラムの募集状況</text>
  <text class="sans title" x="184" y="120">外部出願の受付を停止中</text>
  <rect x="184" y="154" width="205" height="36" rx="18" fill="#f8dfe3"/><text class="sans status" x="286" y="179" text-anchor="middle">現在の状況</text>
  <text class="sans body" x="56" y="250">MIT CSE SMプログラムは現在、外部からの出願を受け付けていません。</text>
  <text class="sans body" x="56" y="286">今後募集が再開される場合は、公式プログラムページで告知されます。</text>
  <line x1="56" y1="336" x2="1144" y2="336" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans note" x="56" y="372">このプログラムを前提に出願計画を立てる前に、MIT CSEの公式入学ページを確認してください。</text>
</svg>
