<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">UIUC ECE MEng degree-completion paths</title>
  <desc id="desc">Three common study plans: an accelerated 1.5-year path, a two-year spring-start path, and a two-year fall-start path with an optional internship.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#2f6fed}.title{font-size:38px;font-weight:760;fill:#10233f}.sub{font-size:19px;fill:#5b687c}.cardTitle{font-size:24px;font-weight:750;fill:#10233f}.term{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:16px;fill:#52627a}.badge{font-size:15px;font-weight:750;fill:#187565}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1400" height="820" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1398" height="818" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="54" y="58">DEGREE PLANNING</text>
  <text class="sans title" x="54" y="105">UIUC ECE MEng completion paths</text>
  <text class="sans sub" x="54" y="143">The internship term changes with your start semester and preferred pace.</text>

  <g class="sans">
    <g transform="translate(40 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">A · 1.5 years</text>
      <line x1="48" y1="120" x2="48" y2="438" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="135" r="11" fill="#2f6fed"/><text class="term" x="80" y="131">Fall 1</text><text class="body" x="80" y="157">Semester 1 · full-time enrollment</text>
      <circle cx="48" cy="225" r="11" fill="#2f6fed"/><text class="term" x="80" y="221">Spring 1</text><text class="body" x="80" y="247">Semester 2 · full-time enrollment</text>
      <circle cx="48" cy="315" r="11" fill="#258a79"/><text class="term" x="80" y="311">Summer 1</text><text class="body" x="80" y="337">Optional internship · CPT + ENG 510</text><text class="body" x="80" y="361">ENG 572 optional (4 hours)</text>
      <circle cx="48" cy="430" r="11" fill="#d97706"/><text class="term" x="80" y="426">Fall 2</text><text class="body" x="80" y="452">Finish 32 hours · graduate in December</text>
      <rect x="26" y="475" width="150" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="101" y="496" text-anchor="middle">FASTEST PATH</text>
    </g>

    <g transform="translate(490 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">B · 2 years · spring start</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">Spring 1</text><text class="body" x="80" y="146">Semester 1 · full-time enrollment</text>
      <circle cx="48" cy="205" r="10" fill="#8fa0b7"/><text class="term" x="80" y="201">Summer 1</text><text class="body" x="80" y="226">No U.S. internship</text>
      <circle cx="48" cy="285" r="10" fill="#2f6fed"/><text class="term" x="80" y="281">Fall 1</text><text class="body" x="80" y="306">Semester 2 · full-time enrollment</text>
      <circle cx="48" cy="365" r="10" fill="#258a79"/><text class="term" x="80" y="361">Spring 2 / Summer 2</text><text class="body" x="80" y="386">Optional internship up to 6 months</text><text class="body" x="80" y="410">CPT + ENG 510; ENG 572 optional</text>
      <circle cx="48" cy="455" r="10" fill="#d97706"/><text class="term" x="80" y="451">Fall 2</text><text class="body" x="80" y="476">Finish 32 hours · graduate in December</text>
    </g>

    <g transform="translate(940 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">C · 2 years · fall start</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">Fall 1</text><text class="body" x="80" y="146">Semester 1 · full-time enrollment</text>
      <circle cx="48" cy="215" r="10" fill="#2f6fed"/><text class="term" x="80" y="211">Spring 1</text><text class="body" x="80" y="236">Semester 2 · full-time enrollment</text>
      <circle cx="48" cy="320" r="10" fill="#258a79"/><text class="term" x="80" y="316">Summer 1 / Fall 2</text><text class="body" x="80" y="341">Optional internship up to 6 months</text><text class="body" x="80" y="365">CPT + ENG 510; ENG 572 optional</text>
      <circle cx="48" cy="435" r="10" fill="#d97706"/><text class="term" x="80" y="431">Spring 2</text><text class="body" x="80" y="456">Finish 32 hours · graduate in May</text>
      <rect x="26" y="475" width="180" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="116" y="496" text-anchor="middle">LONG INTERNSHIP</text>
    </g>
  </g>
  <text class="sans note" x="54" y="770">Illustrative paths based on the program planning graphic. Confirm current enrollment and CPT requirements with UIUC before choosing a plan.</text>
</svg>
