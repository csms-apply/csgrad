<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">UIUC ECE MEng 학위 이수 경로</title>
  <desc id="desc">대표적인 세 가지 학습 계획: 1.5년 단축 경로, 봄학기 시작 2년 경로, 선택 인턴십이 포함된 가을학기 시작 2년 경로.</desc>
  <style>
    .sans{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#2f6fed}.title{font-size:38px;font-weight:760;fill:#10233f}.sub{font-size:19px;fill:#5b687c}.cardTitle{font-size:24px;font-weight:750;fill:#10233f}.term{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:16px;fill:#52627a}.badge{font-size:15px;font-weight:750;fill:#187565}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1400" height="820" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1398" height="818" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="54" y="58">학위 계획</text>
  <text class="sans title" x="54" y="105">UIUC ECE MEng 이수 경로</text>
  <text class="sans sub" x="54" y="143">인턴십 학기는 시작 학기와 원하는 진행 속도에 따라 달라집니다.</text>

  <g class="sans">
    <g transform="translate(40 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">A · 1.5년</text>
      <line x1="48" y1="120" x2="48" y2="438" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="135" r="11" fill="#2f6fed"/><text class="term" x="80" y="131">1학년 가을</text><text class="body" x="80" y="157">1학기 · 전일제 수강</text>
      <circle cx="48" cy="225" r="11" fill="#2f6fed"/><text class="term" x="80" y="221">1학년 봄</text><text class="body" x="80" y="247">2학기 · 전일제 수강</text>
      <circle cx="48" cy="315" r="11" fill="#258a79"/><text class="term" x="80" y="311">1학년 여름</text><text class="body" x="80" y="337">선택 인턴십 · CPT + ENG 510</text><text class="body" x="80" y="361">ENG 572 선택 (4학점)</text>
      <circle cx="48" cy="430" r="11" fill="#d97706"/><text class="term" x="80" y="426">2학년 가을</text><text class="body" x="80" y="452">32학점 이수 · 12월 졸업</text>
      <rect x="26" y="475" width="150" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="101" y="496" text-anchor="middle">최단 경로</text>
    </g>

    <g transform="translate(490 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">B · 2년 · 봄학기 시작</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">1학년 봄</text><text class="body" x="80" y="146">1학기 · 전일제 수강</text>
      <circle cx="48" cy="205" r="10" fill="#8fa0b7"/><text class="term" x="80" y="201">1학년 여름</text><text class="body" x="80" y="226">미국 내 인턴십 없음</text>
      <circle cx="48" cy="285" r="10" fill="#2f6fed"/><text class="term" x="80" y="281">1학년 가을</text><text class="body" x="80" y="306">2학기 · 전일제 수강</text>
      <circle cx="48" cy="365" r="10" fill="#258a79"/><text class="term" x="80" y="361">2학년 봄 / 여름</text><text class="body" x="80" y="386">선택 인턴십 최대 6개월</text><text class="body" x="80" y="410">CPT + ENG 510; ENG 572 선택</text>
      <circle cx="48" cy="455" r="10" fill="#d97706"/><text class="term" x="80" y="451">2학년 가을</text><text class="body" x="80" y="476">32학점 이수 · 12월 졸업</text>
    </g>

    <g transform="translate(940 190)">
      <rect width="420" height="520" rx="22" fill="white" stroke="#dbe3ef" stroke-width="2"/>
      <rect width="420" height="78" rx="22" fill="#eaf0ff"/><rect y="58" width="420" height="20" fill="#eaf0ff"/>
      <text class="cardTitle" x="26" y="48">C · 2년 · 가을학기 시작</text>
      <line x1="48" y1="112" x2="48" y2="450" stroke="#b9c7db" stroke-width="4"/>
      <circle cx="48" cy="125" r="10" fill="#2f6fed"/><text class="term" x="80" y="121">1학년 가을</text><text class="body" x="80" y="146">1학기 · 전일제 수강</text>
      <circle cx="48" cy="215" r="10" fill="#2f6fed"/><text class="term" x="80" y="211">1학년 봄</text><text class="body" x="80" y="236">2학기 · 전일제 수강</text>
      <circle cx="48" cy="320" r="10" fill="#258a79"/><text class="term" x="80" y="316">1학년 여름 / 2학년 가을</text><text class="body" x="80" y="341">선택 인턴십 최대 6개월</text><text class="body" x="80" y="365">CPT + ENG 510; ENG 572 선택</text>
      <circle cx="48" cy="435" r="10" fill="#d97706"/><text class="term" x="80" y="431">2학년 봄</text><text class="body" x="80" y="456">32학점 이수 · 5월 졸업</text>
      <rect x="26" y="475" width="180" height="30" rx="15" fill="#e4f5f0"/><text class="badge" x="116" y="496" text-anchor="middle">장기 인턴십</text>
    </g>
  </g>
  <text class="sans note" x="54" y="770">프로그램 계획 그래픽을 바탕으로 한 예시 경로입니다. 계획을 정하기 전에 UIUC에 현재 수강 및 CPT 요건을 확인하세요.</text>
</svg>
