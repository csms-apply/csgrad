<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="title desc">
  <title id="title">2027 가을학기 대학원 지원 타임라인</title>
  <desc id="desc">2026년 1월부터 2027년 1월까지의 네 단계 준비 과정: 시험, 경험 쌓기, 추천서와 서류 준비, 지원서 제출.</desc>
  <style>
    .sans{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:700;letter-spacing:2px;fill:#2f6fed}.title{font-size:34px;font-weight:750;fill:#10233f}.phase{font-size:24px;font-weight:700;fill:#10233f}.date{font-size:17px;font-weight:750;fill:#2f6fed}.body{font-size:18px;fill:#52627a}.num{font-size:18px;font-weight:800;fill:white}
  </style>
  <rect width="720" height="1160" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="718" height="1158" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans eyebrow" x="40" y="52">지원 일정</text>
  <text class="sans title" x="40" y="96">2027 가을 지원 타임라인</text>
  <text class="sans body" x="40" y="132">스펙 쌓기부터 서류 준비, 제출까지.</text>
  <g class="sans">
    <g transform="translate(40 174)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#2f6fed"/><text class="num" x="42" y="49" text-anchor="middle">1</text><text class="date" x="82" y="48">2026년 1–5월</text><text class="phase" x="28" y="104">시험 준비</text><text class="body" x="28" y="148">필요하면 TOEFL / IELTS와 GRE를 준비합니다.</text></g>
    <g transform="translate(40 410)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#258a79"/><text class="num" x="42" y="49" text-anchor="middle">2</text><text class="date" x="82" y="48">2026년 5–9월</text><text class="phase" x="28" y="104">경험 쌓기</text><text class="body" x="28" y="148">인턴십, 연구, 프로젝트를 보강합니다.</text></g>
    <g transform="translate(40 646)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#8b5cf6"/><text class="num" x="42" y="49" text-anchor="middle">3</text><text class="date" x="82" y="48">2026년 9–10월</text><text class="phase" x="28" y="104">서류 준비</text><text class="body" x="28" y="148">추천인을 확정하고 이력서와 에세이를 초안합니다.</text></g>
    <g transform="translate(40 882)"><rect width="640" height="210" rx="20" fill="white" stroke="#dbe3ef" stroke-width="2"/><circle cx="42" cy="42" r="23" fill="#d97706"/><text class="num" x="42" y="49" text-anchor="middle">4</text><text class="date" x="82" y="48">2026년 10월–2027년 1월</text><text class="phase" x="28" y="104">지원서 제출</text><text class="body" x="28" y="148">학교별 서류를 마무리하고 모든 마감일을 관리합니다.</text></g>
  </g>
</svg>
