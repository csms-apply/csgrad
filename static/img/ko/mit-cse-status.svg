<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">MIT CSE SM 외부 지원자 모집 현황</title>
  <desc id="desc">MIT 계산과학공학(CSE) 석사 프로그램의 외부 지원자 모집은 현재 중단되어 있습니다.</desc>
  <style>
    .sans{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:18px;font-weight:750;letter-spacing:2px;fill:#a31f34}.title{font-size:38px;font-weight:760;fill:#10233f}.body{font-size:22px;fill:#52627a}.status{font-size:17px;font-weight:800;letter-spacing:1px;fill:#8d2521}.note{font-size:16px;fill:#6b7789}
  </style>
  <rect width="1200" height="410" rx="28" fill="#f7f9fc"/>
  <rect x="1" y="1" width="1198" height="408" rx="27" fill="none" stroke="#dbe3ef" stroke-width="2"/>
  <rect x="56" y="56" width="92" height="92" rx="22" fill="#fff0f1"/>
  <path d="M102 79v35M102 130h.1" stroke="#a31f34" stroke-width="10" stroke-linecap="round"/>
  <text class="sans eyebrow" x="184" y="72">프로그램 모집 현황</text>
  <text class="sans title" x="184" y="120">외부 지원자 모집 중단</text>
  <rect x="184" y="154" width="205" height="36" rx="18" fill="#f8dfe3"/><text class="sans status" x="286" y="179" text-anchor="middle">현재 상태</text>
  <text class="sans body" x="56" y="250">MIT CSE SM 프로그램은 현재 외부 지원자를 받지 않습니다.</text>
  <text class="sans body" x="56" y="286">향후 모집이 재개되면 공식 프로그램 페이지에 공지됩니다.</text>
  <line x1="56" y1="336" x2="1144" y2="336" stroke="#dbe3ef" stroke-width="2"/>
  <text class="sans note" x="56" y="372">이 프로그램을 전제로 지원 계획을 세우기 전에 MIT CSE 공식 입학 페이지를 확인하세요.</text>
</svg>
