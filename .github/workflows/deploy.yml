name: Deploy Docusaurus

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Generate programs.json
        run: node scripts/generate-programs.js

      - name: Build Docusaurus site without warnings
        env:
          NODE_OPTIONS: --trace-warnings
        run: |
          csgrad_build_log="${RUNNER_TEMP}/csgrad-build.log"
          npm run build 2>&1 | tee "$csgrad_build_log"
          if grep -Eiq 'warn(ing)?s?|caniuse-lite.*outdated' "$csgrad_build_log"; then
            echo "Build emitted a warning; fix it before merging."
            exit 1
          fi

      - name: Test SEO safeguards
        run: npm run test:seo

      - name: Test analytics safeguards
        run: npm run test:analytics

      - name: Test migration safeguards
        run: npm run test:migration

      - name: Test GPA filtering
        run: npm run test:gpa-filter

      - name: Audit built SEO output
        run: npm run check:seo

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          ssh $SSH_USER@$SSH_HOST << 'EOF'
            set -eu
            cd csgrad
            git -c core.fileMode=false pull --ff-only origin main
            bash run.sh
          EOF
