name: Deploy Docusaurus

permissions:
  contents: read

# PR: a new push cancels the PR's older run. main: runs queue one after another
# and are never cancelled midway, since a deploy may be switching releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test dependency audit safeguards
        run: npm run test:dependencies

      - name: Reject high and critical dependency vulnerabilities
        run: npm run audit:dependencies

      - name: Test program catalog and legacy links
        run: npm run test:catalog

      - name: Build Docusaurus site without warnings
        shell: bash
        env:
          NODE_OPTIONS: --trace-warnings
        run: |
          set -o pipefail
          csgrad_build_log="${RUNNER_TEMP}/csgrad-build.log"
          npm run build 2>&1 | tee "$csgrad_build_log"
          if grep -Eiq 'warn(ing)?s?|caniuse-lite.*outdated' "$csgrad_build_log"; then
            echo "Build emitted a warning; fix it before merging."
            exit 1
          fi

      - name: Check built program links and homepages
        run: node scripts/check-built-programs.mjs

      - name: Test atomic deployment activation
        run: python3 scripts/atomic-deploy.test.py

      - name: Test Traditional Chinese content and links
        run: npm run test:traditional

      - name: Test SEO safeguards
        run: npm run test:seo

      - name: Test analytics safeguards
        run: npm run test:analytics

      - name: Test migration safeguards
        run: npm run test:migration

      - name: Test GPA filtering
        run: npm run test:gpa-filter

      - name: Test navigation, tracker data protection, and DP error states
        run: npm run test:ux

      - name: Audit built SEO output
        run: npm run check:seo

      # Ship the build validated above instead of rebuilding on the server.
      - name: Deploy validated build via SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          # Every locale gets its own copy of static/; hard links make tar send each file once.
          python3 - build <<'PY'
          import hashlib, os, sys
          seen = {}
          for root, _, names in os.walk(sys.argv[1]):
              for name in names:
                  path = os.path.join(root, name)
                  with open(path, 'rb') as f:
                      first = seen.setdefault(hashlib.sha256(f.read()).digest(), path)
                  if first != path:
                      os.link(first, path + '.tmp-link')
                      os.replace(path + '.tmp-link', path)
          PY

          # run.sh unpacks into a fresh release and switches only after it is complete.
          tar -czf - -C build . | ssh $SSH_USER@$SSH_HOST \
            'bash -lc "cd csgrad && git -c core.fileMode=false pull --ff-only origin main </dev/null && bash run.sh --prebuilt"'
